backend:
  name: git-gateway
  repo: brooklinepg/hillvue-haven
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: settings
    label: Site Content
    files:

      - name: content
        label: 🏠 All Site Content
        file: _data/content.json
        fields:

          - label: Page Title
            name: site_title
            widget: string
            hint: Appears in browser tab

          - label: Meta Description
            name: meta_description
            widget: text
            hint: Used by Google — keep under 160 characters

          # ── HERO ──────────────────────────────────────────────
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - label: Status Pill Text
                name: pill_text
                widget: string
                hint: "e.g. 46 Mustang Close, Hillvue NSW — Now Available"
              - label: Headline Line 1
                name: headline_line1
                widget: string
              - label: Headline Line 2 (italic/peach)
                name: headline_line2
                widget: string
              - label: Subheadline
                name: subheadline
                widget: text
              - label: Hero Image
                name: hero_image
                widget: image
                hint: Use a wide landscape photo — min 1400px wide
              - label: Primary Button Text
                name: cta_primary_text
                widget: string
              - label: Secondary Button Text
                name: cta_secondary_text
                widget: string

          # ── STATS STRIP ───────────────────────────────────────
          - label: Stats Strip
            name: stats
            widget: list
            max: 4
            fields:
              - { label: Number / Text, name: number, widget: string }
              - { label: Label, name: label, widget: string }

          # ── WELCOME ───────────────────────────────────────────
          - label: Welcome Section
            name: welcome
            widget: object
            fields:
              - { label: Tag Line, name: tag, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Headline (italic part), name: headline_em, widget: string }
              - { label: Paragraph 1, name: body_1, widget: text }
              - { label: Paragraph 2, name: body_2, widget: text }
              - { label: Paragraph 3, name: body_3, widget: text }
              - label: Welcome Image
                name: welcome_image
                widget: image
              - label: Certification Badges
                name: certs
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - label: Style
                    name: style
                    widget: select
                    options:
                      - { label: Terracotta (FA), value: terra }
                      - { label: Sage (IL / default), value: sage }

          # ── RESIDENCES ────────────────────────────────────────
          - label: House (2 Bed + OOA)
            name: house
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image }
              - label: Feature Pills
                name: pills
                widget: list
                field: { label: Pill, name: pill, widget: string }

          - label: Villa (1 Bed, No OOA)
            name: villa
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image }
              - label: Feature Pills
                name: pills
                widget: list
                field: { label: Pill, name: pill, widget: string }

          # ── FEATURES ──────────────────────────────────────────
          - label: Features (Built to a Higher Standard)
            name: features
            widget: list
            max: 6
            fields:
              - { label: Number, name: number, widget: string, hint: "e.g. 01" }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          # ── QUOTE ─────────────────────────────────────────────
          - label: Pull Quote
            name: quote
            widget: object
            fields:
              - { label: Quote Text, name: text, widget: text }
              - { label: Attribution, name: attribution, widget: string }

          # ── OUTDOOR ───────────────────────────────────────────
          - label: Outdoor Living Section
            name: outdoor
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Headline (italic part), name: headline_em, widget: string }
              - { label: Paragraph 1, name: body_1, widget: text }
              - { label: Paragraph 2, name: body_2, widget: text }
              - label: Checklist Items
                name: checklist
                widget: list
                field: { label: Item, name: item, widget: string }
              - { label: Background Image, name: image, widget: image }

          # ── LOCATION ──────────────────────────────────────────
          - label: Location / Neighbourhood
            name: location
            widget: object
            fields:
              - { label: Address, name: address, widget: string }
              - label: Points of Interest
                name: pois
                widget: list
                fields:
                  - { label: Icon (emoji), name: icon, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Distance / Detail, name: distance, widget: string }

          # ── GALLERY ───────────────────────────────────────────
          - label: Gallery
            name: gallery
            widget: object
            fields:
              - label: Images
                name: images
                widget: list
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Alt Text, name: alt, widget: string }
                  - label: Wide (takes more space)
                    name: wide
                    widget: boolean
                    default: false

          # ── CONTACT ───────────────────────────────────────────
          - label: Contact Details
            name: contact
            widget: object
            fields:
              - { label: Address, name: address, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: SDA Provider Name, name: sda_provider, widget: string }
              - { label: SDA Provider URL, name: sda_provider_url, widget: string }
              - { label: SIL Provider Name, name: sil_provider, widget: string }
              - { label: SIL Provider URL, name: sil_provider_url, widget: string }
              - { label: Manager Blurb, name: manager_blurb, widget: text }
