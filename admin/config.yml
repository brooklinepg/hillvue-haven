backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  - name: "hero"
    label: "Hero"
    files:
      - label: "Hero"
        name: "hero"
        file: "content/hero.json"
        fields:
          - { label: "Status Pill Text", name: "pill_text", widget: "string" }
          - { label: "Headline Line 1", name: "headline_line1", widget: "string" }
          - { label: "Headline Line 2 (italic, shown after 'to')", name: "headline_line2", widget: "string" }
          - { label: "Subheadline", name: "subheadline", widget: "text" }
          - { label: "Hero Image", name: "hero_image", widget: "image" }
          - { label: "Primary Button Text", name: "cta_primary_text", widget: "string" }
          - { label: "Secondary Button Text", name: "cta_secondary_text", widget: "string" }

  - name: "stats"
    label: "Stats Strip"
    files:
      - label: "Stats"
        name: "stats"
        file: "content/stats.json"
        fields:
          - label: "Stats"
            name: "stats"
            widget: "list"
            max: 4
            fields:
              - { label: "Number / Text", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

  - name: "welcome"
    label: "Welcome"
    files:
      - label: "Welcome"
        name: "welcome"
        file: "content/welcome.json"
        fields:
          - { label: "Tag Line", name: "tag", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline (italic part)", name: "headline_em", widget: "string" }
          - { label: "Paragraph 1", name: "body_1", widget: "text" }
          - { label: "Paragraph 2", name: "body_2", widget: "text" }
          - { label: "Paragraph 3", name: "body_3", widget: "text" }
          - { label: "Image", name: "welcome_image", widget: "image" }
          - label: "Certification Pills"
            name: "certs"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Colour", name: "style", widget: "select", options: ["terra", "sage"] }

  - name: "residences"
    label: "Residences"
    files:
      - label: "Residences"
        name: "residences"
        file: "content/residences.json"
        fields:
          - label: "House"
            name: "house"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Feature Pills", name: "pills", widget: "list", field: { label: "Pill", name: "pill", widget: "string" } }
          - label: "Villa"
            name: "villa"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Feature Pills", name: "pills", widget: "list", field: { label: "Pill", name: "pill", widget: "string" } }

  - name: "features"
    label: "Features"
    files:
      - label: "Features"
        name: "features"
        file: "content/features.json"
        fields:
          - label: "Features"
            name: "features"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "quote"
    label: "Quote"
    files:
      - label: "Quote"
        name: "quote"
        file: "content/quote.json"
        fields:
          - { label: "Quote Text", name: "text", widget: "text" }
          - { label: "Attribution", name: "attribution", widget: "string" }

  - name: "outdoor"
    label: "Outdoor Living"
    files:
      - label: "Outdoor"
        name: "outdoor"
        file: "content/outdoor.json"
        fields:
          - { label: "Tag Line", name: "tag", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline (italic part)", name: "headline_em", widget: "string" }
          - { label: "Paragraph 1", name: "body_1", widget: "text" }
          - { label: "Paragraph 2", name: "body_2", widget: "text" }
          - { label: "Checklist", name: "checklist", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
          - { label: "Image", name: "image", widget: "image" }

  - name: "location"
    label: "Location"
    files:
      - label: "Location"
        name: "location"
        file: "content/location.json"
        fields:
          - { label: "Address (used for map)", name: "address", widget: "string" }
          - label: "Points of Interest"
            name: "pois"
            widget: "list"
            fields:
              - { label: "Emoji Icon", name: "icon", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Distance / Detail", name: "distance", widget: "string" }

  - name: "gallery"
    label: "Gallery"
    files:
      - label: "Gallery"
        name: "gallery"
        file: "content/gallery.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - { label: "Wide format?", name: "wide", widget: "boolean", default: false }

  - name: "contact"
    label: "Contact"
    files:
      - label: "Contact"
        name: "contact"
        file: "content/contact.json"
        fields:
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "SDA Provider", name: "sda_provider", widget: "string" }
          - { label: "SDA Provider URL", name: "sda_provider_url", widget: "string" }
          - { label: "SIL Provider", name: "sil_provider", widget: "string" }
          - { label: "SIL Provider URL", name: "sil_provider_url", widget: "string" }
          - { label: "Managed-by Blurb", name: "manager_blurb", widget: "text" }
